<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SIP Revenue Dashboard</title>
<style>
:root{
--font-anthropic-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
--font-anthropic-serif:Georgia,'Times New Roman',serif;
--color-bg:#f7f7f5;--color-fg:#1f1f1d;--color-fg-muted:#6b6a66;--color-panel:#ffffff;--color-border-line:#e4e3df;
--color-ok:#2e7d32;--color-bad:#b3261e;
--cds-font-size-title:32px;--cds-font-size-heading:17px;--cds-font-size-body:15px;--cds-font-size-caption:13px;--cds-font-weight-medium:600;
--cds-gap-sm:8px;--cds-gap-md:16px;--cds-gap-lg:24px;--cds-pad-lg:20px;--cds-radius:10px;
--cds-chart-axis:#a9a8a3;--cds-chart-grid:#ecebe7;--cds-chart-reference:#8f8e89;--cds-chart-muted:#9b9a95;
--cds-chart-status-critical:#c5362c;--cds-chart-status-warning:#d08a12;
--cds-text-secondary:#6b6a66;--cds-surface-popover:#ffffff;--cds-border:#e4e3df;--cds-shadow-popover:0 4px 16px rgba(0,0,0,.10)}
@media (prefers-color-scheme:dark){:root{
--color-bg:#1b1b1a;--color-fg:#ecebe7;--color-fg-muted:#a3a29d;--color-panel:#252524;--color-border-line:#3a3a38;
--color-ok:#6cc070;--color-bad:#f07167;--cds-chart-axis:#6f6e6a;--cds-chart-grid:#323230;--cds-chart-reference:#8a8984;--cds-chart-muted:#8a8984;
--cds-chart-status-critical:#f07167;--cds-chart-status-warning:#e8a33a;--cds-text-secondary:#a3a29d;--cds-surface-popover:#2c2c2b;--cds-border:#3a3a38}}
[hidden]{display:none!important}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans)}
body{padding:28px 20px 60px}
.dash-select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--color-border-line);border-radius:8px;background:var(--color-panel);color:var(--color-fg);min-width:200px}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--color-bg);z-index:50}
#gate div{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:12px;padding:28px;width:min(340px,90vw);display:flex;flex-direction:column;gap:12px}
#gate h1{font:400 24px/1.2 var(--font-anthropic-serif);margin:0}
#gate input{font:inherit;padding:9px 11px;border:1px solid var(--color-border-line);border-radius:8px;background:var(--color-bg);color:var(--color-fg)}
#gate button{font:inherit;font-weight:600;padding:9px;border:0;border-radius:8px;background:var(--color-fg);color:var(--color-bg);cursor:pointer}
#gate p{margin:0;font-size:14px;color:var(--color-fg-muted)}
</style>
</head>
<body>
<div id="gate"><p id="gate-msg">Loading…</p></div>
<div id="app" hidden>
<!--PAGE-->
</div>
<script src="/d3.min.js"></script>
<script>
(function(){
  var calcs={},draws={},cbs=[],raw=null,cache={};
  var params={view:'insights',dept:'All',otype:'All',lens:'order',o_dept:'All departments',o_otype:'Fresh',o_meas:'subs'};
  function val(id){
    if(raw&&Object.prototype.hasOwnProperty.call(raw,id))return raw[id];
    if(cache[id])return cache[id];
    var c=calcs[id];if(!c)throw new Error('Unknown data: '+id);
    return cache[id]=c.fn.apply(null,c.inputs.map(val));
  }
  function render(){
    cbs.forEach(function(f){try{f();}catch(e){console.error(e);}});
    Object.keys(draws).forEach(function(n){
      document.querySelectorAll('[data-draw="'+n+'"]').forEach(function(el){
        if(el.closest('[hidden]'))return;
        try{draws[n](el);}catch(e){console.error('draw '+n,e);}
      });
    });
  }
  var queued=false;
  function schedule(){if(queued)return;queued=true;setTimeout(function(){queued=false;if(raw)render();},0);}
  window.dash={
    colors:['#2a78d6','#d97706','#7c3aed','#0f9d8a','#c2417a'],
    calc:function(id,o){calcs[id]=o;},
    draw:function(n,f){draws[n]=f;},
    onData:function(f){cbs.push(f);},
    data:function(id){if(!raw)return{status:'loading'};try{return{status:'ok',data:val(id)};}catch(e){console.error(e);return{status:'error'};}},
    params:function(){return params;},
    setParams:function(o){Object.assign(params,o);schedule();},
    setLink:function(v){try{history.replaceState(null,'','#'+v);}catch(e){}},
    _load:function(d){raw=d;cache={};schedule();}
  };
  var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(schedule,150);});
  var gate=document.getElementById('gate'),msg=document.getElementById('gate-msg');
  window.addEventListener('error',function(e){if(!gate.hidden)msg.textContent='Error: '+(e.message||'script failed to load');});
  var slow=setTimeout(function(){if(!gate.hidden)msg.textContent='Still loading the data… if this stays, refresh the page.';},15000);
  fetch('/api/data',{cache:'no-store'}).then(function(r){
    if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){throw new Error(j.error||'Could not load the data.');});
    return r.json();
  }).then(function(d){clearTimeout(slow);gate.hidden=true;document.getElementById('app').hidden=false;window.dash._load(d);})
  .catch(function(err){msg.textContent=err.message;});
})();
</script>
<!--SCRIPT-->
</body>
</html>
